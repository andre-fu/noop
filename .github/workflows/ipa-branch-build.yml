# Fork-only (andre-fu/noop): build the unsigned sideload .ipa from ANY branch and upload it as a
# WORKFLOW ARTIFACT — no release is created or touched, unlike fork-testing-build.yml's rolling
# testing-latest tag. For trying one feature branch on a device via AltStore/SideStore before it
# merges. iOS steps mirror fork-testing-build.yml's ios job (Release, watch stripped, widget kept,
# replaceable ad-hoc capability signature via Tools/prepare-ios-sideload-app.sh).
name: iOS ipa from branch (fork)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / ref to build"
        required: true
        default: "strava-hr-merge"

jobs:
  ios:
    # iOS 26 Liquid Glass (glassEffect) needs the iOS 26 SDK → Xcode 26 → macos-26.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build NOOPiOS for device (unsigned, Release)
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build
      - name: Package sideload .ipa (strip watch, preserve app/widget capabilities)
        run: |
          VER=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo ".app (iphoneos) not found"; exit 1; }
          rm -rf "$APP/Watch"
          test -d "$APP/PlugIns/NOOPWidgets.appex" || {
            echo "NOOPWidgets.appex missing from iOS build"; exit 1;
          }
          Tools/prepare-ios-sideload-app.sh "$APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qr "NOOP-ios-unsigned-v${VER}-${GITHUB_SHA:0:7}.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NOOP-ios-unsigned-ipa
          path: "NOOP-ios-unsigned-*.ipa"
          retention-days: 14
